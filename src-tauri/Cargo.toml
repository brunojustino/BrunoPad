[package]
name = "brunopad"
version = "0.1.0"
description = "A local markdown-first desktop editor"
authors = ["brunopad"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "brunopad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2.6.0", features = ["watch"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }

[target.'cfg(debug_assertions)'.dependencies]
tauri-plugin-wdio = "1.4.0"
